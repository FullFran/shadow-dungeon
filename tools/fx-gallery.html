<!doctype html>
<!-- Dev tool, not part of the build: `npm run dev`, then /tools/fx-gallery.html.
     Every move on Mimikyu: the old hand-drawn look next to the new one. ?only=fury-swipes,slash ?slow=3 ?at=0.3 (freeze) -->
<html lang="es">
<head>
<meta charset="utf-8" />
<title>Efectos: antes y ahora</title>
<style>
  body { margin: 0; background: #14121c; color: #d8d4e4; font: 13px monospace; }
  header { position: sticky; top: 0; z-index: 1; display: flex; gap: 12px; align-items: center; padding: 8px 12px; background: #14121c; flex-wrap: wrap; }
  input { background: #22202e; color: inherit; border: 1px solid #4a4660; padding: 4px 8px; font: inherit; }
  canvas { display: block; image-rendering: pixelated; max-width: 100%; }
</style>
</head>
<body>
<header>
  <label>Buscar <input id="search" placeholder="golpes furia" /></label>
  <label>Velocidad <select id="speed"><option value="1">normal</option><option value="2">x0,5</option><option value="4">x0,25</option></select></label>
  <span id="stats"></span>
</header>
<canvas id="c"></canvas>
<script type="module">
  import es from '../src/i18n/es.json';
  import { MOVES } from '../src/data/moves.ts';
  import { SPRITE_KEYS, SPRITES } from '../src/data/sprites.ts';
  import { browserFxBackend, FxStore } from '../src/adapters/fx/store.ts';
  import { drawFxFrame, fitScale, frameAt, FxSystem } from '../src/adapters/fx/system.ts';
  import { cueKey, cueRequest, impactCue, projectileCue } from '../src/adapters/fx/cues.ts';
  import { moveSpawn, SHOT_HEIGHT } from '../src/adapters/fx/director.ts';
  import { drawPlayerVfx, drawProjectileVfx, playerVfx } from '../src/adapters/move-vfx.ts';

  const params = new URLSearchParams(location.search);
  const AT = params.get('at');
  const PANEL = { w: 190, h: 120 };
  const SCALE = Number(params.get('scale') ?? 2);
  const COLS = Number(params.get('cols') ?? 2);
  const PERIOD_MS = 1500;
  const all = Object.values(MOVES).map((m) => ({ move: m, name: es[`move.${m.id}`] ?? m.id }));
  const only = params.get('only')?.split(',');
  let shown = only ? all.filter((e) => only.includes(e.move.id)) : all;
  const canvas = document.getElementById('c');
  const ctx = canvas.getContext('2d');
  const search = document.getElementById('search');
  const speed = document.getElementById('speed');
  if (params.get('slow')) speed.value = params.get('slow');
  const normal = (s) => s.toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '');
  function layout() {
    canvas.width = COLS * PANEL.w * 2 * SCALE;
    canvas.height = Math.max(1, Math.ceil(shown.length / COLS)) * (PANEL.h + 14) * SCALE;
    ctx.imageSmoothingEnabled = false;
  }
  search.addEventListener('input', () => {
    const q = normal(search.value);
    shown = all.filter((e) => normal(e.name).includes(q) || e.move.id.includes(q));
    layout();
  });
  layout();

  const store = new FxStore(browserFxBackend());
  const fx = new FxSystem(store);
  const images = new Map();
  function sheet(name, anim) {
    const key = SPRITE_KEYS[name];
    const meta = SPRITES.sprites[key]?.anims?.[anim];
    if (!meta) return null;
    const url = `${import.meta.env.BASE_URL}sprites/${key}/${meta.file}`;
    if (!images.has(url)) { const i = new Image(); i.src = url; images.set(url, i); }
    return { image: images.get(url), meta };
  }
  function drawSprite(name, anim, row, x, y, timeMs) {
    const s = sheet(name, anim);
    if (!s || !s.image.complete || !s.image.naturalWidth) { ctx.fillStyle = '#5a5570'; ctx.fillRect(x - 6, y - 16, 12, 20); return; }
    const { frameWidth: w, frameHeight: h, durations, anchor } = s.meta;
    const total = durations.reduce((a, b) => a + b, 0);
    let tick = Math.floor(timeMs * SPRITES.ticksPerSecond / 1000) % total;
    let frame = 0;
    while (tick >= durations[frame]) tick -= durations[frame++];
    ctx.drawImage(s.image, frame * w, row * h, w, h, Math.round(x - anchor.x), Math.round(y - anchor.y), w, h);
  }

  const aim = { x: 1, y: 0 };
  function fake(move, at, t) {
    const active = move.activeMs;
    const action = t < active ? { moveId: move.id, phase: 'active', phaseMs: t, chargeMs: 0, chargeLevel: 0, aimDir: aim, hitWindow: move.multiHit ? Math.floor((t / active) * move.multiHit) : 0 }
      : t < active + 400 ? { moveId: move.id, phase: 'recovery', phaseMs: t - active, chargeMs: 0, chargeLevel: 0, aimDir: aim } : null;
    return { pos: at, action, items: [], upgrades: {}, level: 1, buff: undefined };
  }
  function drawNew(cue, spawn, progress) {
    if (progress < 0 || progress >= 1) return;
    const effect = store.get(cueKey(cue), cueRequest(cue));
    if (effect) drawFxFrame(ctx, effect, frameAt(effect.frames.length, progress), spawn, fitScale(effect, spawn.placement, spawn.fit, spawn.fitHeight));
  }

  function panel(move, x, y, t, isNew, label, now) {
    ctx.fillStyle = isNew ? '#23202f' : '#1b1924';
    ctx.fillRect(x, y, PANEL.w, PANEL.h);
    ctx.fillStyle = isNew ? '#9ad08f' : '#8d88a0';
    ctx.font = '8px monospace';
    ctx.fillText(label, x + 4, y + PANEL.h - 4);
    const at = { x: x + 52, y: y + 62 };
    const target = { x: at.x + (move.hitbox.kind === 'self' ? 200 : 44), y: at.y };
    const shot = move.hitbox.kind === 'projectile';
    const self = move.hitbox.kind === 'self';
    const player = fake(move, at, t);
    ctx.save();
    ctx.beginPath(); ctx.rect(x, y, PANEL.w, PANEL.h); ctx.clip();
    if (!self) drawSprite('koffing', 'Idle', 0, target.x + 40, target.y, now);
    if (shot) {
      const speed = move.hitbox.speed || 0;
      const dist = speed * (t / 1000);
      const flying = t < (speed ? (84 / speed) * 1000 : 900);
      const pos = { x: at.x + (speed ? dist : 40), y: at.y };
      if (flying) {
        const p = { owner: 'player', radius: move.hitbox.radius, type: move.type, moveId: move.id, vel: { x: speed, y: 0 } };
        const cue = projectileCue(move.type, move.id);
        const drawn = isNew && fx.drawLoop(ctx, cue, { x: pos.x, y: pos.y - 6, placement: 'aim', angle: 0, fitHeight: p.radius * SHOT_HEIGHT.player * (cue.shotScale ?? 1) }, now);
        if (!drawn) drawProjectileVfx(ctx, p, pos, now);
      } else if (isNew) {
        const hitAt = speed ? (84 / speed) * 1000 : 900;
        const cue = impactCue(move.type, move.juice === 'heavy');
        drawNew(cue, { x: target.x + 40, y: target.y - 8, placement: 'body' }, (t - hitAt) / cue.playMs);
      }
    } else {
      const spawn = moveSpawn(move, player.action ? player : { ...player, action: { aimDir: aim, chargeLevel: 0 } });
      const ready = spawn && store.get(cueKey(spawn.cue), cueRequest(spawn.cue));
      drawPlayerVfx(ctx, playerVfx(player), at, now, isNew && ready ? 0.45 : 1);
      if (isNew && spawn) {
        const { cue } = spawn;
        drawNew(cue, spawn, t / cue.playMs);
        if (!self) {
          const hit = impactCue(move.type, move.juice === 'heavy');
          const hitT = t - move.activeMs * 0.5;
          const fit = move.juice === 'heavy' ? 34 : 22;
          drawNew(hit, { x: target.x + 40, y: target.y - 8, placement: 'body', fit }, hitT / hit.playMs);
        }
      }
    }
    drawSprite('mimikyu', t < 300 && !shot ? 'Attack' : 'Idle', 2, at.x, at.y, now);
    ctx.restore();
  }

  const started = performance.now();
  function frame(now) {
    store.tick(now);
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    ctx.fillStyle = '#14121c';
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    ctx.setTransform(SCALE, 0, 0, SCALE, 0, 0);
    const slow = Number(speed.value);
    const clock = (now - started) / slow;
    const t = AT !== null ? Number(AT) * 600 : clock % PERIOD_MS;
    shown.forEach((e, i) => {
      const x = (i % COLS) * PANEL.w * 2;
      const y = Math.floor(i / COLS) * (PANEL.h + 14);
      ctx.fillStyle = '#e8e4f4';
      ctx.font = '9px monospace';
      ctx.fillText(`${e.name}  (${e.move.id})`, x + 4, y + 10);
      panel(e.move, x, y + 14, t, false, 'antes', clock);
      panel(e.move, x + PANEL.w, y + 14, t, true, 'ahora', clock);
    });
    document.getElementById('stats').textContent = `${shown.length} movimientos · memoria ${(store.decodedBytes / 1048576).toFixed(1)} MB`;
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
</script>
</body>
</html>
