# Builds the demo and publishes dist/ to GitHub Pages.
# The build uses a relative base (vite.config.ts), so it works under /<repo>/.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      # The Sendas' boss proofs are slow: run them only when a push touches what they prove
      # (a manual run, or a push whose base is unknown, always runs them).
      - name: Boss proofs (when their inputs changed)
        run: |
          BASE="${{ github.event.before }}"
          if [ "${{ github.event_name }}" != "push" ] || ! git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            npm run test:proofs
          elif git diff --name-only "$BASE" "${{ github.sha }}" | grep -qE '^(src/sim/|src/data/story|src/data/story-quests|src/data/.*cards|src/core/(cards|danmaku|damage|boss|combat)|src/data/(types|difficulty|rooms|dungeons|tuning|sima-story|endless)\.ts|src/core/sima-story\.ts|src/data/story/|tests/sim/(story-prove|wound-prove|story-prove-sima))'; then
            npm run test:proofs
          else
            echo "Boss proofs skipped: nothing they prove changed."
          fi
      - run: npm run build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
