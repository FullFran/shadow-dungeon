<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>Mazmorra Sombría</title>
    <link rel="manifest" href="./manifest.webmanifest" />
    <meta name="theme-color" content="#05060d" />
    <link rel="icon" type="image/png" href="./icons/icon-192.png" />
    <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Mazmorra" />
    <style>
      /* Pixelify Sans, SIL OFL 1.1 (public/fonts/PixelifySans-OFL.txt). Relative to the page, so it follows the Vite base. */
      @font-face { font-family: 'Pixelify Sans'; src: url('./fonts/PixelifySans.ttf') format('truetype'); font-weight: 400 700; font-display: swap; }
      :root { color-scheme: dark; }
      /*
       * Pixelify Sans ships real weights (variable 400-700), but its bold "e" fills its own counter at any size
       * (playtest 2026-10-26: "la e no cierra"). Text stays at 400 (headings and strong included) and the browser never
       * fakes a weight or a slant. Sizes for the results screen sit on the font's 11 px grid (half-steps of 5.5 px on touch).
       */
      h1, h2, h3, h4, h5, h6, strong, b, th { font-weight: 400; }
      body { margin: 0; background: var(--md-ink, #05060d); color: var(--md-text, #f5f7ff); font-family: var(--md-font, ui-monospace, monospace); font-size: var(--md-body, 22px); line-height: 1.25; -webkit-font-smoothing: none; font-synthesis: none;
        /* The font's fi/fl ligatures read as other letters. */
        font-variant-ligatures: none; font-feature-settings: 'liga' 0, 'clig' 0, 'dlig' 0; }
      input, button { font-variant-ligatures: none; font-feature-settings: 'liga' 0, 'clig' 0, 'dlig' 0; }

      /* ---- UI components (src/ui): window and cursor list; tokens come from src/ui/tokens.ts ---- */
      .md-window { position: relative; box-sizing: border-box; padding: 22px 24px 18px; border: 3px solid var(--md-border); border-radius: 12px;
        background: linear-gradient(180deg, var(--md-window-top), var(--md-window-bottom));
        box-shadow: 0 0 0 3px var(--md-ink), inset 0 0 0 3px rgba(5, 6, 13, 0.75), inset 0 0 0 5px var(--md-border-shade), 0 9px 0 3px rgba(0, 0, 0, 0.4);
        animation: md-open var(--md-open-ms, 120ms) ease-out both; transform-origin: 50% 40%; text-align: left; }
      .md-window.still { animation: none; }
      .md-window-title { position: absolute; top: -0.85em; left: 18px; margin: 0; padding: 2px 14px; font-size: var(--md-body); color: var(--md-cursor);
        background: var(--md-window-top); border: 3px solid var(--md-border); border-radius: 9px; box-shadow: 0 0 0 3px var(--md-ink); white-space: nowrap; }
      .md-window-body > :first-child { margin-top: 0; }
      .md-window-body > :last-child { margin-bottom: 0; }
      .md-window p { margin: 0.4em 0; }
      .md-window .dim { color: var(--md-text-dim); }
      .md-stat { display: flex; justify-content: space-between; gap: 2em; padding: 2px 0; }
      .md-stat-value { color: var(--md-cursor); }
      .md-list { display: flex; flex-direction: column; gap: 2px; outline: none; scrollbar-color: var(--md-border-shade) transparent; }
      /* A list that scrolls inside its window never squeezes a row: two-line rows keep their height instead of overlapping. */
      .md-list > .md-item, .md-list > .md-list-header { flex-shrink: 0; }
      .md-list.horizontal { flex-direction: row; flex-wrap: wrap; justify-content: center; gap: 18px; }
      .md-item { all: unset; box-sizing: border-box; display: flex; align-items: center; gap: 10px; min-height: 1.6em; padding: 3px 12px 3px 6px; border-radius: 6px; cursor: pointer; color: var(--md-text); }
      .md-item:focus-visible { outline: 3px solid var(--md-cursor); }
      .md-item.is-active { background: rgba(255, 255, 255, 0.09); box-shadow: inset 0 0 0 2px rgba(255, 255, 255, 0.12); }
      .md-item.is-disabled { color: var(--md-disabled); cursor: default; }
      .md-cursor { flex: none; width: 10px; height: 14px; background: var(--md-cursor); clip-path: polygon(0 0, 100% 50%, 0 100%); visibility: hidden; }
      .md-item.is-active .md-cursor { visibility: visible; animation: md-bob var(--md-bob-ms, 600ms) steps(1) infinite; }
      .md-label { flex: 1; }
      .md-value { display: flex; align-items: center; gap: 10px; color: var(--md-cursor); white-space: nowrap; }
      .md-item.is-disabled .md-value { color: var(--md-disabled); }
      .md-arrow { width: 0; height: 0; font-size: 0; border-top: 7px solid transparent; border-bottom: 7px solid transparent; padding: 0 2px; opacity: 0; }
      .md-arrow:first-child { border-right: 9px solid var(--md-text-dim); }
      .md-arrow:last-child { border-left: 9px solid var(--md-text-dim); }
      .md-item.is-active .md-arrow { opacity: 1; }
      .md-arrow:hover { filter: brightness(1.6); }
      .md-list-header { margin: 12px 0 2px; padding-left: 6px; color: var(--md-text-dim); }
      .md-list-header:first-child { margin-top: 0; }
      /* A list and the description of its cursor row (src/ui/describe.ts): the description on the right, in a box as large as its largest
         text (every row's text sits in the same grid cell, all but the live one hidden), so no window resizes and no row moves when the cursor does. */
      .md-menu { display: grid; grid-template-columns: minmax(0, 1fr) var(--md-desc-width, 15em); gap: 0 24px; align-items: start; }
      .md-desc { display: grid; min-width: 0; }
      .md-desc > * { grid-area: 1 / 1; min-width: 0; }
      .md-desc-ghost { visibility: hidden; pointer-events: none; }
      /* Too narrow for two columns (a phone held upright): the box goes under the list, still as tall as its largest text. */
      @media (max-width: 640px) { .md-menu { grid-template-columns: minmax(0, 1fr); gap: 12px; } }
      @keyframes md-open { from { opacity: 0; transform: scale(0.94); } to { opacity: 1; transform: none; } }
      @keyframes md-bob { 0% { transform: translateX(0); } 50% { transform: translateX(3px); } }
      @media (prefers-reduced-motion: reduce) { .md-window, .md-item.is-active .md-cursor { animation: none; } }
      /* ---- Screens (src/app) ---- */
      #app { position: relative; min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 22px; padding: 40px 16px 88px; box-sizing: border-box; }
      canvas.backdrop { position: fixed; left: 0; top: 0; z-index: -1; image-rendering: pixelated; image-rendering: crisp-edges; pointer-events: none; }
      canvas.game { max-width: 100vw; max-height: 100vh; image-rendering: pixelated; image-rendering: crisp-edges; cursor: crosshair; display: block; }
      #app:has(canvas.game) { padding: 0; }
      .notice { position: fixed; bottom: 6px; left: 0; right: 0; margin: 0 auto; max-width: 70rem; padding: 0 16px; font-size: 16px; line-height: 1.2; color: var(--md-text-dim); opacity: 0.8; text-align: center; pointer-events: none; text-shadow: 0 2px 0 var(--md-ink); }
      .notice p { margin: 2px 0; }
      .notice.in-game { font-size: 11px; opacity: 0.5; }
      .hint { margin: 0; color: var(--md-text-dim); font-size: 16px; text-shadow: 0 2px 0 var(--md-ink); }
      .screen-title { margin: 0; font-size: var(--md-heading); color: var(--md-text); text-shadow: 0 3px 0 var(--md-eclipse), 0 6px 0 var(--md-ink); letter-spacing: 0.04em; }
      .screen-row { display: flex; flex-wrap: wrap; gap: 28px; align-items: flex-start; justify-content: center; max-width: 100%; }
      .md-window.narrow { min-width: 20rem; max-width: 30rem; }
      .md-window.wait p { margin: 0; text-align: center; }
      .net-toast { position: fixed; top: 12px; left: 16px; right: 16px; margin: 0 auto; max-width: 40rem; padding: 8px 12px; z-index: 20; text-align: center; color: var(--md-text); background: rgba(15, 26, 69, 0.94); border: 2px solid var(--md-ink); border-radius: 6px; pointer-events: none; }
      a { color: var(--md-xp); }

      .title-logo { text-align: center; margin-top: 18vh; }
      .title-logo h1 { margin: 0; font-size: var(--md-title); line-height: 1; color: #fff4f0; letter-spacing: 0.03em;
        text-shadow: 0 4px 0 var(--md-eclipse), 0 8px 0 #3a0610, 0 0 30px rgba(232, 40, 58, 0.55); }
      .title-logo .title-alt { margin: 12px 0 0; color: var(--md-text-dim); letter-spacing: 0.3em; text-transform: uppercase; text-shadow: 0 2px 0 var(--md-ink); }
      .title-menu { min-width: 17rem; }

      .species { width: 19rem; }
      .species p { font-size: 16px; }
      .species .ability { margin-top: 8px; color: var(--md-text-dim); }
      .portrait-frame { display: flex; justify-content: center; padding: 8px 0 4px; margin-bottom: 6px; border-radius: 8px; background: radial-gradient(ellipse at 50% 70%, rgba(232, 40, 58, 0.25), transparent 65%); }
      canvas.portrait { image-rendering: pixelated; image-rendering: crisp-edges; }
      .type-row { display: flex; gap: 8px; justify-content: center; margin-bottom: 8px; }
      .type-badge { display: inline-block; padding: 0 8px; border-radius: 6px; font-size: 16px; line-height: 1.5; color: #fff; border: 2px solid rgba(0, 0, 0, 0.45); text-shadow: 0 1px 0 rgba(0, 0, 0, 0.6); }
      .type-ghost { background: #6a55a3; } .type-fairy { background: #d9719c; } .type-dark { background: #5a4636; }
      .type-normal { background: #8d8d66; } .type-poison { background: #93409a; } .type-steel { background: #7d84a0; }
      .type-fire { background: #d8642f; } .type-ground { background: #a8803f; }
      .type-grass { background: #4f9a3a; } .type-bug { background: #8a9a2a; } .type-electric { background: #c9a216; } .type-fighting { background: #a8402c; }
      .type-rock { background: #9a8458; } .type-psychic { background: #d9507f; } .type-ice { background: #4fa8b8; } .type-flying { background: #6f8fc8; } .type-water { background: #3f74c8; }
      .species .goal { margin-top: 12px; color: var(--md-cursor); }
      .moves { width: 33rem; max-width: 100%; }
      .dungeon-about { width: 20em; max-width: 100%; box-sizing: border-box; }
      .move-row { padding-top: 6px; padding-bottom: 6px; }
      .move-card { display: flex; flex-direction: column; gap: 2px; }
      .move-head { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
      .move-power { color: var(--md-cursor); }
      .move-desc { color: var(--md-text-dim); font-size: 16px; }
      .tier-badge { padding: 0 6px; border-radius: 6px; font-size: 14px; color: var(--md-ink); background: #8fb3d9; }
      .tier-master { background: #e0b84f; }
      .rank-stars { color: var(--md-cursor); letter-spacing: 1px; }
      .equipped { margin-left: auto; padding: 0 8px; border-radius: 6px; font-size: 16px; color: var(--md-ink); background: var(--md-cursor); }
      .start-row .md-label { color: var(--md-cursor); }

      .settings { width: 42rem; max-width: 100%; }
      .settings .md-value, .pause-settings .md-value { min-width: 9rem; justify-content: flex-end; }
      .settings .md-label, .pause-settings .md-label { white-space: nowrap; }
      .md-volume { display: inline-flex; align-items: center; gap: 10px; }
      .md-volume > span:last-child { min-width: 3.2em; text-align: right; }
      .md-meter { display: inline-flex; gap: 2px; }
      .md-meter i { width: 6px; height: 14px; background: var(--md-bar-back); box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.12); }
      .md-meter i.on { background: var(--md-cursor); }
      .controls { width: 28rem; max-width: 100%; }
      .control-list { margin: 0; padding-left: 1.1em; font-size: 16px; line-height: 1.35; color: var(--md-text-dim); }
      .control-list li + li { margin-top: 4px; }

      .credits { width: 46rem; max-width: 100%; }
      .credit-scroll { max-height: calc(100vh - 260px); overflow-y: auto; padding-right: 10px; margin-bottom: 10px; scrollbar-color: var(--md-border-shade) transparent; }
      .credit-list a, .credit-list .dim { font-size: 16px; }
      .credit-list { list-style: none; margin: 6px 0 12px; padding: 0; display: grid; grid-template-columns: repeat(auto-fill, minmax(17rem, 1fr)); gap: 8px 22px; }
      .credit-sprites { font-size: 16px; }

      .online { min-width: 24rem; }
      .join-row .md-value { gap: 0; }
      input.code-input { font: inherit; color: var(--md-cursor); background: var(--md-ink); border: 2px solid var(--md-border-shade); border-radius: 6px; padding: 2px 8px; width: 6.5em; text-transform: uppercase; letter-spacing: 0.2em; }
      input.code-input:focus { outline: none; border-color: var(--md-cursor); }
      .lobby-error { color: var(--md-danger); margin: 8px 0 0; font-size: 16px; }
      .lobby-error:empty { display: none; }
      .lobby { min-width: 22rem; max-width: 32rem; }
      /* Account screen (src/app/account-screen.ts): email and password keep their case; long emails wrap. */
      .md-window.account { max-width: 34rem; }
      input.code-input.account-input { width: 14em; max-width: 100%; text-transform: none; letter-spacing: normal; }
      .account-row .md-label { flex: 1 1 auto; min-width: 0; }
      .account-email { color: var(--md-cursor); overflow-wrap: anywhere; }
      .account-note { margin: 8px 0 0; font-size: 16px; }
      .account-summary { font-size: 16px; }
      /* Cloud sync (src/app/account-screen.ts): side cards, the status line and the "Deshacer" notice (it takes clicks, unlike .net-toast). */
      .sync-headline { color: var(--md-cursor); margin: 0 0 6px; }
      .sync-cards { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin: 6px 0; }
      .sync-card { border: 2px solid var(--md-ink); border-radius: 6px; padding: 6px 8px; margin: 6px 0; font-size: 16px; }
      .sync-cards .sync-card { margin: 0; }
      .sync-card p { margin: 0; overflow-wrap: anywhere; }
      .sync-card-title { color: var(--md-cursor); }
      .sync-status { margin: 4px 0 6px; }
      .sync-undo { position: fixed; bottom: 16px; left: 16px; right: 16px; margin: 0 auto; max-width: 34rem; display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 8px 12px; z-index: 21; color: var(--md-text); background: rgba(15, 26, 69, 0.96); border: 2px solid var(--md-ink); border-radius: 6px; }
      .sync-undo-button { font: inherit; color: var(--md-cursor); background: transparent; border: 2px solid var(--md-cursor); border-radius: 4px; padding: 2px 10px; cursor: pointer; }
      @media (max-width: 560px) {
        .sync-cards { grid-template-columns: 1fr; }
      }
      @media (max-width: 560px) {
        .account .md-item { flex-wrap: wrap; row-gap: 2px; }
        .account .md-item.account-row { flex-wrap: nowrap; }
        .account .md-value { min-width: 0; max-width: 100%; margin-left: auto; white-space: normal; }
      }
      /* Capitals and digits only (no lowercase "e" to fill in): the one place the real 700 weight stays. */
      .room-code { font-size: var(--md-title); font-weight: 700; letter-spacing: 0.25em; color: var(--md-cursor); margin: 6px 0 4px; text-shadow: 0 4px 0 var(--md-ink); user-select: all; }
      .players { min-width: 14rem; }
      .roster { list-style: none; margin: 0; padding: 0; }
      .roster li { padding: 3px 0; }
      .roster-id { color: var(--md-cursor); margin-right: 10px; }

      .overlay { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; padding: 16px; background: rgba(3, 4, 12, 0.72); z-index: 10; }
      .pause-menu { min-width: 18rem; }
      .pause-settings { width: 42rem; max-width: 100%; }
      .items { width: 26rem; max-width: 100%; }
      .held-items { list-style: none; margin: 0; padding: 0; }
      .held-items li + li { margin-top: 8px; }
      .held-items .dim { font-size: 16px; }
      /* Many held items: two columns, and the list scrolls inside the window when it is still too tall. */
      .items.many { width: 46rem; }
      .items .md-window-body { max-height: calc(100vh - 140px); overflow-y: auto; overscroll-behavior: contain; }
      .items.many .held-items { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px 20px; }
      .items.many .held-items li + li { margin-top: 0; }
      .held-items .rarity-common strong { color: var(--md-rarity-common); }
      .held-items .rarity-uncommon strong { color: var(--md-rarity-uncommon); }
      .held-items .rarity-rare strong { color: var(--md-rarity-rare); }

      .result { min-width: 24rem; text-align: left; }
      .result h1 { margin: 0 0 4px; font-size: var(--md-heading); }
      .result.victory h1 { color: var(--md-cursor); }
      .result.defeat h1 { color: var(--md-eclipse); }
      .result h3 { margin: 14px 0 4px; font-size: 11px; text-transform: uppercase; letter-spacing: 0.15em; }
      .result .md-stat-value { text-align: right; max-width: 16rem; }
      .result-actions { margin-top: 16px; }
      .result-columns { display: grid; gap: 0 2.5rem; }
      @media (min-width: 900px) { .result-columns { grid-template-columns: 1fr 1fr; } .result { min-width: 46rem; } }
      /* End screen: the fan notice flows under the window instead of floating over its buttons (the page scrolls if it must). */
      #app:has(.result) { padding-bottom: 12px; }
      #app:has(.result) > .notice { position: static; width: 100%; box-sizing: border-box; }
      /* Short windows (1024×640 and the like): tighter lines and the two actions on one row, so the Sima's end screen fits. */
      @media (max-height: 760px) {
        #app:has(.result) { gap: 10px; padding-top: 16px; }
        .result { padding-top: 16px; padding-bottom: 12px; }
        .result h1 { font-size: 22px; }
        .result > .md-window-body > p { margin: 0.2em 0; }
        .result h3 { margin: 8px 0 2px; font-size: 11px; }
        .result .md-stat { padding: 0; line-height: 1.25; }
        .result-actions { flex-direction: row; justify-content: center; gap: 24px; margin-top: 10px; }
      }
      .shop { width: 52rem; max-width: 100%; }
      .shop.tutor { width: 60rem; }
      .shop.travel { width: 44rem; }
      .travel-detail h3 { margin: 0 0 6px; }
      .travel-lines { margin: 0; padding-left: 1.2em; }
      .shop .shop-effect { margin: 0; }
      .shop .shop-balance { margin-bottom: 8px; }
      /* The move tutor: its long list scrolls inside the window; the build hint in the cursor colour. */
      .tutor .shop-list { max-height: 44vh; overflow-y: auto; }
      .tutor .tutor-build, .loadout-build { margin: 0 0 8px; color: var(--md-cursor); }
      /* Phantump's stall: the reveal line in the rarity's colour (a tap ends it early). */
      .gacha .gacha-reveal { min-height: 1.3em; margin: 0 0 4px; cursor: pointer; }
      .gacha .gacha-reveal.is-common { color: #8fd0ff; }
      .gacha .gacha-reveal.is-rare { color: #ffd166; }
      /* A shiny pull and a worn shiny skin (odd/tasks/shiny-echo.md): a sparkle over the portrait. */
      .gacha .gacha-reveal.is-shiny { color: #ff9be8; text-shadow: 0 0 6px rgba(255, 155, 232, 0.8); }
      .portrait-frame { position: relative; }
      .portrait-frame.is-shiny { background: radial-gradient(ellipse at 50% 70%, rgba(255, 155, 232, 0.3), transparent 65%); }
      .shiny-sparkle { position: absolute; top: 2px; right: 18%; color: #fff6b0; font-size: 1.4em; text-shadow: 0 0 8px #ff9be8; animation: shiny-twinkle 0.9s ease-in-out infinite alternate; pointer-events: none; }
      @keyframes shiny-twinkle { from { opacity: 0.35; transform: scale(0.8) rotate(0deg); } to { opacity: 1; transform: scale(1.2) rotate(20deg); } }
      @media (prefers-reduced-motion: reduce) { .shiny-sparkle { animation: none; } }
      .gacha .shop-effect p { margin: 0; }
      /* Achievements (src/app/achievements.ts): the cursor family's list scrolls; unlocked ones in the cursor colour; the unlock toast like the install banner. */
      .achievements .achievement-list { max-height: 40vh; overflow-y: auto; overscroll-behavior: contain; }
      .achievement p { margin: 0; }
      .achievement { margin: 0 0 6px; }
      .achievement.is-done > p:first-child { color: var(--md-cursor); }
      .achievement-toast { position: fixed; left: 0; right: 0; top: max(10px, env(safe-area-inset-top)); display: flex; justify-content: center; padding: 0 16px; z-index: 16; cursor: pointer; }
      .achievement-toast .md-window { max-width: 30rem; padding: 10px 16px 8px; font-size: 18px; }
      .achievement-toast p { margin: 0.15em 0; }
      /* The notice board's missions (src/app/board.ts): the cursor's mission told beside the list. */
      .board .mission-detail p { margin: 0 0 4px; }
      .board .mission-state { color: var(--md-cursor); }
      /* Santuario de los Juramentos (src/app/shrine.ts) */
      .shrine { min-width: 36rem; max-width: 46rem; }
      .shrine h3 { margin: 0 0 10px; font-size: 16px; font-weight: 400; text-transform: uppercase; letter-spacing: 0.15em; }
      .shrine-body { display: grid; gap: 0 1.6rem; }
      @media (min-width: 760px) { .shrine-body { grid-template-columns: minmax(16rem, 1fr) 1fr; } }
      .shrine-about { min-height: 7em; }
      .shrine-about p { margin: 0.3em 0 0.6em; }
      .shrine-best .md-stat-value { display: inline-flex; align-items: center; gap: 0.3em; }
      .shrine-best .portrait { image-rendering: pixelated; }
      .shrine-loadout-for { text-align: center; margin: -0.4em 0 0.6em; }
      .shrine-note { margin: 10px 0 0; font-size: 16px; }
      .shrine-result { min-width: 24rem; }
      .shrine-new { color: var(--md-cursor); }
      .town-shop { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; z-index: 5; }

      .item-pick.shared { position: fixed; left: 0; right: 0; bottom: 3rem; display: flex; justify-content: center; pointer-events: none; z-index: 8; }
      .item-pick .pick-panel { max-width: 52rem; pointer-events: auto; }
      /* A Senda memory fragment (app/memory-card.ts): a narrow card, the name in gold, the text as an item description. */
      .memory-card .memory-panel { max-width: 30rem; }
      .memory-card .memory-name { display: block; color: #f3d98a; margin-bottom: 0.5rem; letter-spacing: 0.04em; }
      .memory-card .memory-text { font-style: italic; line-height: 1.45; margin: 0 0 0.8rem; }
