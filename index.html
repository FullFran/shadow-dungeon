<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mazmorra Sombría</title>
    <style>
      /* Pixelify Sans, SIL OFL 1.1 (public/fonts/PixelifySans-OFL.txt). Relative to the page, so it follows the Vite base. */
      @font-face { font-family: 'Pixelify Sans'; src: url('./fonts/PixelifySans.ttf') format('truetype'); font-weight: 400 700; font-display: swap; }
      :root { color-scheme: dark; }
      body { margin: 0; background: var(--md-ink, #05060d); color: var(--md-text, #f5f7ff); font-family: var(--md-font, ui-monospace, monospace); font-size: var(--md-body, 22px); line-height: 1.25; -webkit-font-smoothing: none; }

      /* ---- UI components (src/ui): window and cursor list; tokens come from src/ui/tokens.ts ---- */
      .md-window { position: relative; box-sizing: border-box; padding: 22px 24px 18px; border: 3px solid var(--md-border); border-radius: 12px;
        background: linear-gradient(180deg, var(--md-window-top), var(--md-window-bottom));
        box-shadow: 0 0 0 3px var(--md-ink), inset 0 0 0 3px rgba(5, 6, 13, 0.75), inset 0 0 0 5px var(--md-border-shade), 0 9px 0 3px rgba(0, 0, 0, 0.4);
        animation: md-open var(--md-open-ms, 120ms) ease-out both; transform-origin: 50% 40%; text-align: left; }
      .md-window.still { animation: none; }
      .md-window-title { position: absolute; top: -0.85em; left: 18px; margin: 0; padding: 2px 14px; font-size: var(--md-body); font-weight: 700; color: var(--md-cursor);
        background: var(--md-window-top); border: 3px solid var(--md-border); border-radius: 9px; box-shadow: 0 0 0 3px var(--md-ink); white-space: nowrap; }
      .md-window-body > :first-child { margin-top: 0; }
      .md-window-body > :last-child { margin-bottom: 0; }
      .md-window p { margin: 0.4em 0; }
      .md-window .dim { color: var(--md-text-dim); }
      .md-stat { display: flex; justify-content: space-between; gap: 2em; padding: 2px 0; }
      .md-stat-value { color: var(--md-cursor); }
      .md-list { display: flex; flex-direction: column; gap: 2px; outline: none; }
      .md-list.horizontal { flex-direction: row; flex-wrap: wrap; justify-content: center; gap: 18px; }
      .md-item { all: unset; box-sizing: border-box; display: flex; align-items: center; gap: 10px; min-height: 1.6em; padding: 3px 12px 3px 6px; border-radius: 6px; cursor: pointer; color: var(--md-text); }
      .md-item:focus-visible { outline: 3px solid var(--md-cursor); }
      .md-item.is-active { background: rgba(255, 255, 255, 0.09); box-shadow: inset 0 0 0 2px rgba(255, 255, 255, 0.12); }
      .md-item.is-disabled { color: var(--md-disabled); cursor: default; }
      .md-cursor { flex: none; width: 10px; height: 14px; background: var(--md-cursor); clip-path: polygon(0 0, 100% 50%, 0 100%); visibility: hidden; }
      .md-item.is-active .md-cursor { visibility: visible; animation: md-bob var(--md-bob-ms, 600ms) steps(1) infinite; }
      .md-label { flex: 1; }
      .md-value { display: flex; align-items: center; gap: 10px; color: var(--md-cursor); white-space: nowrap; }
      .md-item.is-disabled .md-value { color: var(--md-disabled); }
      .md-arrow { width: 0; height: 0; font-size: 0; border-top: 7px solid transparent; border-bottom: 7px solid transparent; padding: 0 2px; opacity: 0; }
      .md-arrow:first-child { border-right: 9px solid var(--md-text-dim); }
      .md-arrow:last-child { border-left: 9px solid var(--md-text-dim); }
      .md-item.is-active .md-arrow { opacity: 1; }
      .md-arrow:hover { filter: brightness(1.6); }
      .md-list-header { margin: 12px 0 2px; padding-left: 6px; color: var(--md-text-dim); }
      .md-list-header:first-child { margin-top: 0; }
      @keyframes md-open { from { opacity: 0; transform: scale(0.94); } to { opacity: 1; transform: none; } }
      @keyframes md-bob { 0% { transform: translateX(0); } 50% { transform: translateX(3px); } }
      @media (prefers-reduced-motion: reduce) { .md-window, .md-item.is-active .md-cursor { animation: none; } }
      #app { min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 1rem; box-sizing: border-box; }
      canvas.game { max-width: 100vw; max-height: 100vh; image-rendering: pixelated; image-rendering: crisp-edges; cursor: crosshair; display: block; }
      .notice { position: fixed; bottom: 0.25rem; left: 0; right: 0; margin: 0 auto; max-width: 60rem; font-size: 0.7rem; opacity: 0.6; text-align: center; pointer-events: none; }
      .notice p { margin: 0.25rem 0; }
      .notice.in-game { font-size: 0.6rem; opacity: 0.45; }
      .panel { max-width: 34rem; width: 100%; padding: 1.5rem 2rem 4rem; box-sizing: border-box; }
      .panel h1 { margin: 0; font-size: 2rem; color: #d9c6ff; }
      .panel h2 { margin: 1.25rem 0 0.5rem; font-size: 1rem; color: #b9a4ff; }
      .panel .subtitle { margin: 0.25rem 0 1rem; opacity: 0.75; }
      .panel ul { margin: 0; padding-left: 1.2rem; line-height: 1.5; font-size: 0.9rem; }
      .panel .goal { font-size: 0.9rem; opacity: 0.85; }
      .panel.defeat h1 { color: #ff7a7a; }
      .panel.victory h1 { color: #ffd36b; }
      .overlay { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; background: rgba(10, 8, 16, 0.78); z-index: 10; }
      .overlay .panel { background: #1d1a26; border: 1px solid #4a4360; border-radius: 6px; padding: 1.5rem 2rem; }
      .overlay .panel .row + .row { margin-top: 0.75rem; }
      label:has(input:disabled) { opacity: 0.5; }
      .row { display: flex; flex-wrap: wrap; gap: 0.75rem; align-items: center; }
      button, select { font: inherit; color: inherit; background: #2b2638; border: 1px solid #4a4360; border-radius: 4px; padding: 0.4rem 0.8rem; }
      button { cursor: pointer; }
      input[type="range"] { accent-color: #b9a4ff; vertical-align: middle; width: 7rem; }
      button[aria-pressed="true"] { background: #4a3a78; border-color: #b9a4ff; }
      button.primary { margin-top: 1.25rem; background: #6a4fc0; border-color: #b9a4ff; font-weight: bold; padding: 0.6rem 1.6rem; }
      .panel .room-code { font-family: ui-monospace, monospace; font-size: 3.5rem; font-weight: bold; letter-spacing: 0.35em; color: #ffd36b; margin: 0.25rem 0 0.75rem; user-select: all; }
      .panel .roster { list-style: none; padding: 0; font-size: 1.1rem; }
      .panel .lobby-error { color: #ff7a7a; min-height: 1.2em; font-size: 0.9rem; }
      input.code-input { font: inherit; color: inherit; background: #2b2638; border: 1px solid #4a4360; border-radius: 4px; padding: 0.4rem 0.6rem; width: 6.5rem; text-transform: uppercase; letter-spacing: 0.15em; }
      pre.net-stats { position: fixed; top: 0.5rem; left: 0.5rem; margin: 0; padding: 0.5rem 0.75rem; background: rgba(10, 8, 16, 0.75); border: 1px solid #4a4360; border-radius: 4px; font: 12px/1.4 ui-monospace, monospace; color: #cfe8c0; pointer-events: none; z-index: 5; }
      .item-pick.shared { position: fixed; left: 0; right: 0; bottom: 2.5rem; display: flex; justify-content: center; pointer-events: none; z-index: 8; }
      .item-pick .pick-panel { background: rgba(29, 26, 38, 0.94); border: 1px solid #4a4360; border-radius: 6px; padding: 1rem 1.25rem; text-align: center; max-width: 40rem; pointer-events: auto; }
      .item-pick h2 { margin: 0 0 0.75rem; font-size: 1.1rem; color: #d9c6ff; }
      .item-pick .pick-row { display: flex; gap: 0.75rem; justify-content: center; flex-wrap: wrap; }
      .pick-card { position: relative; display: flex; flex-direction: column; gap: 0.35rem; width: 11rem; min-height: 8rem; padding: 0.75rem; text-align: left; border-width: 2px; }
      .pick-card:hover { background: #3a3350; }
      .pick-card .pick-key { position: absolute; top: 0.4rem; right: 0.55rem; font-family: ui-monospace, monospace; opacity: 0.6; }
      .pick-card .pick-rarity { font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.05em; }
      .pick-card .pick-description { font-size: 0.85rem; opacity: 0.9; }
      .pick-card .pick-held { font-size: 0.75rem; color: #b9a4ff; }
      .pick-card.rarity-common { border-color: #c9c2dd; } .pick-card.rarity-common .pick-rarity { color: #c9c2dd; }
      .pick-card.rarity-uncommon { border-color: #5aa9ff; } .pick-card.rarity-uncommon .pick-rarity { color: #5aa9ff; }
      .pick-card.rarity-rare { border-color: #ffd36b; } .pick-card.rarity-rare .pick-rarity { color: #ffd36b; }
      .item-pick .pick-hint { margin: 0.6rem 0 0; font-size: 0.8rem; opacity: 0.7; }
      .panel ul.held-items { font-size: 0.85rem; }
      button:focus-visible, select:focus-visible, input:focus-visible { outline: 2px solid #ffd36b; outline-offset: 2px; }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/app/main.ts"></script>
  </body>
</html>
