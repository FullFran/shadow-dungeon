<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>Mazmorra Sombría</title>
    <link rel="manifest" href="./manifest.webmanifest" />
    <meta name="theme-color" content="#050407" />
    <link rel="icon" type="image/png" href="./icons/icon-192.png" />
    <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Mazmorra" />
    <style>
      /* Pixelify Sans, SIL OFL 1.1 (public/fonts/PixelifySans-OFL.txt). Relative to the page, so it follows the Vite base. */
      @font-face { font-family: 'Pixelify Sans'; src: url('./fonts/PixelifySans.ttf') format('truetype'); font-weight: 400 700; font-display: swap; }
      /* Atkinson Hyperlegible, SIL OFL 1.1 (public/fonts/AtkinsonHyperlegible-OFL.txt): the reading face for long text and
         the fields players type in (tickets SD-E7HAFY, SD-D1ZBRQ; odd/tasks/menu-redesign.md T1). Titles, menu rows and the HUD stay pixel. */
      @font-face { font-family: 'Atkinson Hyperlegible'; src: url('./fonts/AtkinsonHyperlegible-Regular.ttf') format('truetype'); font-weight: 400; font-display: swap; }
      @font-face { font-family: 'Atkinson Hyperlegible'; src: url('./fonts/AtkinsonHyperlegible-Bold.ttf') format('truetype'); font-weight: 700; font-display: swap; }
      .md-window p, .md-window li, .md-desc, .move-desc, .pick-description, .mission-detail, .travel-detail, .account-note, .shrine-note, .memory-text,
      input, textarea, select { font-family: var(--md-text-font); -webkit-font-smoothing: antialiased; font-variant-ligatures: normal; font-feature-settings: normal; }
      .md-window p, .md-window li, .md-desc, .move-desc, .pick-description, .mission-detail, .travel-detail, .account-note, .shrine-note, .memory-text { font-size: var(--md-text-size); line-height: 1.4; }
      :root { color-scheme: dark; }
      /*
       * Pixelify Sans ships real weights (variable 400-700), but its bold "e" fills its own counter at any size
       * (playtest 2026-10-26: "la e no cierra"). Text stays at 400 (headings and strong included) and the browser never
       * fakes a weight or a slant. Sizes for the results screen sit on the font's 11 px grid (half-steps of 5.5 px on touch).
       */
      h1, h2, h3, h4, h5, h6, strong, b, th { font-weight: 400; }
      body { margin: 0; background: var(--md-ink, #050407); color: var(--md-text, #f5f7ff); font-family: var(--md-font, ui-monospace, monospace); font-size: var(--md-body, 22px); line-height: 1.25; -webkit-font-smoothing: none; font-synthesis: none;
        /* The font's fi/fl ligatures read as other letters. */
        font-variant-ligatures: none; font-feature-settings: 'liga' 0, 'clig' 0, 'dlig' 0; }
      input, button { font-variant-ligatures: none; font-feature-settings: 'liga' 0, 'clig' 0, 'dlig' 0; }

      /* ---- UI components (src/ui): window and cursor list; tokens come from src/ui/tokens.ts ---- */
      /* The relic slab (.agents/DESIGN.md §4, 2026-11-03): dark stone, an old-gold hairline frame with a bevel, gilt corner studs
         and a faint warm light from the top where the eclipse touches it. Every window and overlay of the game uses it. */
      .md-window { position: relative; box-sizing: border-box; padding: 22px 24px 18px; border: 2px solid var(--md-border); border-radius: 6px;
        background: radial-gradient(120% 60% at 50% 0%, rgba(255, 138, 61, 0.07), transparent 60%), linear-gradient(180deg, var(--md-window-top), var(--md-window-bottom));
        box-shadow: 0 0 0 2px var(--md-ink), inset 0 0 0 2px rgba(5, 4, 7, 0.85), inset 0 0 0 3px var(--md-border-shade), inset 0 0 40px rgba(0, 0, 0, 0.55), 0 10px 0 2px rgba(0, 0, 0, 0.45), 0 0 40px rgba(0, 0, 0, 0.6);
        animation: md-open var(--md-open-ms, 120ms) ease-out both; transform-origin: 50% 40%; text-align: left; }
      .md-window::after { content: ''; position: absolute; inset: -6px; pointer-events: none;
        background: linear-gradient(var(--md-border), var(--md-border)) top left / 10px 2px, linear-gradient(var(--md-border), var(--md-border)) top left / 2px 10px,
          linear-gradient(var(--md-border), var(--md-border)) top right / 10px 2px, linear-gradient(var(--md-border), var(--md-border)) top right / 2px 10px,
          linear-gradient(var(--md-border), var(--md-border)) bottom left / 10px 2px, linear-gradient(var(--md-border), var(--md-border)) bottom left / 2px 10px,
          linear-gradient(var(--md-border), var(--md-border)) bottom right / 10px 2px, linear-gradient(var(--md-border), var(--md-border)) bottom right / 2px 10px;
        background-repeat: no-repeat; opacity: 0.9; }
      .md-window.still { animation: none; }
      .md-window-title { position: absolute; top: -0.85em; left: 18px; margin: 0; padding: 2px 16px; font-size: var(--md-body); color: var(--md-cursor); letter-spacing: 0.06em;
        background: linear-gradient(180deg, #2a2026, var(--md-window-bottom)); border: 2px solid var(--md-border); border-radius: 4px; box-shadow: 0 0 0 2px var(--md-ink), inset 0 1px 0 rgba(255, 220, 160, 0.15);
        text-shadow: 0 0 10px rgba(255, 138, 61, 0.45), 0 2px 0 var(--md-ink); white-space: nowrap; }
      .md-window-body > :first-child { margin-top: 0; }
      .md-window-body > :last-child { margin-bottom: 0; }
      .md-window p { margin: 0.4em 0; }
      /* "Instalar" in the title's top right corner while the game can be installed (src/ui/pwa.ts corner). */
      .pwa-corner { position: fixed; top: max(14px, env(safe-area-inset-top)); right: max(16px, env(safe-area-inset-right)); z-index: 8; display: inline-flex; align-items: center; gap: 8px; padding: 6px 14px; cursor: pointer;
        font: inherit; font-size: 18px; color: var(--md-ink); background: var(--md-cursor); border: 2px solid var(--md-ink); border-radius: 10px; box-shadow: 0 0 0 2px var(--md-cursor), 0 0 18px rgba(255, 191, 94, 0.45), 0 4px 0 rgba(0, 0, 0, 0.45); }
      .pwa-corner svg { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
      .pwa-corner:hover, .pwa-corner:focus-visible { filter: brightness(1.08); transform: translateY(-1px); }
      html.touch .pwa-corner { font-size: 15px; padding: 5px 10px; }
      /* Cinematics: press to advance or Auto (src/app/prologue.ts; odd/tasks/menu-redesign.md S13). */
      .prologue-text { position: relative; }
      .prologue-next { position: absolute; right: 0; bottom: -4px; font-size: 14px; color: var(--md-cursor); opacity: 0; }
      .prologue-next.is-visible { opacity: 1; animation: prologue-next 0.9s ease-in-out infinite; }
      @keyframes prologue-next { 50% { transform: translateY(3px); opacity: 0.55; } }
      @media (prefers-reduced-motion: reduce) { .prologue-next.is-visible { animation: none; } }
      /* Title: a dominant Play, the other rows quiet (odd/tasks/menu-redesign.md S11). */
      .title-menu { min-width: min(420px, 86vw); }
      .title-row-play { padding-top: 6px; padding-bottom: 8px; }
      .title-play { display: flex; flex-direction: column; gap: 2px; }
      .title-play-name { font-size: 44px; line-height: 1; color: var(--md-cursor); text-shadow: 0 0 14px rgba(255, 106, 61, 0.55), 0 3px 0 var(--md-ink); letter-spacing: 0.04em; }
      .title-play small { font-family: var(--md-text-font); font-size: 16px; color: var(--md-text-dim); }
      .title-row-online, .title-row-options { font-size: 19px; color: var(--md-text-dim); }
      /* Options: grouped rows with their glyph, wide enough that no label wraps. */
      .menu-window.options .shop-list { min-width: 15em; }
      .menu-row-icon { display: inline-flex; align-items: center; gap: 10px; white-space: nowrap; }
      .menu-row-icon svg { width: 22px; height: 22px; flex: none; fill: none; stroke: currentColor; stroke-width: 1.4; stroke-linecap: round; stroke-linejoin: round; opacity: 0.85; }
      /* The tutorial sign as a carved stone inscription (src/ui/tutorial-sign.ts; odd/tasks/menu-redesign.md T7, owner: "hazlos mas bonitos"):
         a slate slab with a chiselled bevel and grain, an eclipse emblem and an engraved ember title, keys raised as stone keycaps. Original, CSS only. */
      .tutorial-sign { position: absolute; top: 11%; left: 50%; transform: translateX(-50%); width: max-content; max-width: min(580px, 88vw); padding: 12px 22px 14px; pointer-events: none; z-index: 5; border-radius: 4px;
        background:
          radial-gradient(ellipse at 30% 0%, rgba(255, 255, 255, 0.07), transparent 60%),
          repeating-linear-gradient(115deg, rgba(255, 255, 255, 0.018) 0 2px, rgba(0, 0, 0, 0.03) 2px 5px),
          linear-gradient(180deg, #34333a 0%, #23222a 55%, #1a1920 100%);
        border: 1px solid #0b0b0f;
        box-shadow: 0 0 0 2px #5d5a66, 0 0 0 4px var(--md-ink), inset 0 1px 0 rgba(255, 255, 255, 0.14), inset 0 -2px 0 rgba(0, 0, 0, 0.5), inset 0 0 18px rgba(0, 0, 0, 0.55), 0 10px 24px rgba(0, 0, 0, 0.6), 0 0 26px rgba(232, 40, 58, 0.12);
        animation: tutorial-sign 7s ease-out both; }
      .tutorial-sign::before, .tutorial-sign::after { content: ''; position: absolute; top: 7px; width: 5px; height: 5px; border-radius: 50%; background: radial-gradient(circle at 35% 35%, #8b8794, #2a2830); box-shadow: 0 1px 0 rgba(0, 0, 0, 0.6); }
      .tutorial-sign::before { left: 8px; }
      .tutorial-sign::after { right: 8px; }
      .tutorial-sign-head { display: flex; align-items: center; justify-content: center; gap: 10px; margin-bottom: 6px; }
      .tutorial-sign-emblem { width: 14px; height: 14px; border-radius: 50%; background: radial-gradient(circle at 60% 40%, #0a0a0e 0 52%, transparent 53%), var(--md-eclipse); box-shadow: 0 0 8px rgba(255, 106, 61, 0.7); flex: none; }
      .tutorial-sign-title { font-family: var(--md-font); font-size: 14px; letter-spacing: 0.22em; text-transform: uppercase; color: #e79a6a; text-shadow: 0 1px 0 #000, 0 -1px 0 rgba(255, 255, 255, 0.08); }
      .tutorial-sign-text { margin: 0; text-align: center; font-family: var(--md-text-font); font-size: 18px; line-height: 1.5; color: #e9e6df; text-shadow: 0 1px 0 #000; }
      .tutorial-sign-text kbd { display: inline-block; margin: 0 2px; padding: 0 7px; min-width: 1.2em; border-radius: 4px; font-family: var(--md-font); font-size: 15px; line-height: 1.5; color: #f1ead2; vertical-align: 1px;
        background: linear-gradient(180deg, #57545f, #3a3842); border: 1px solid #16151a; box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.22), 0 2px 0 #121116; }
      @keyframes tutorial-sign { 0% { opacity: 0; transform: translate(-50%, 10px); filter: brightness(1.6); } 7% { opacity: 1; transform: translate(-50%, 0); filter: brightness(1); } 88% { opacity: 1; } 100% { opacity: 0; transform: translate(-50%, -4px); } }
      @media (prefers-reduced-motion: reduce) { .tutorial-sign { animation: none; } }
      /* Solo: the sign waits for a press (the run is paused): it stays, takes the tap, and says how to go on. */
      .tutorial-sign.is-waiting { pointer-events: auto; cursor: pointer; animation: tutorial-sign-in 0.4s ease-out both; }
      .tutorial-sign-footer { margin: 8px 0 0; text-align: center; font-family: var(--md-text-font); font-size: 14px; color: #b9b3a8; animation: tutorial-sign-blink 1.4s ease-in-out infinite; }
      .tutorial-sign-footer kbd { display: inline-block; margin: 0 2px; padding: 0 6px; border-radius: 4px; font-family: var(--md-font); font-size: 13px; color: #f1ead2; background: linear-gradient(180deg, #57545f, #3a3842); border: 1px solid #16151a; box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.22), 0 2px 0 #121116; }
      @keyframes tutorial-sign-in { 0% { opacity: 0; transform: translate(-50%, 10px); filter: brightness(1.6); } 100% { opacity: 1; transform: translate(-50%, 0); filter: brightness(1); } }
      @keyframes tutorial-sign-blink { 50% { opacity: 0.55; } }
      @media (prefers-reduced-motion: reduce) { .tutorial-sign.is-waiting, .tutorial-sign-footer { animation: none; } }
      /* Solo, a Senda's spoken line waits in a dialog box with the run paused (src/app/game.ts tell; odd/tasks/menu-redesign.md S13). */
      .story-box { position: absolute; left: 50%; bottom: 14%; transform: translateX(-50%); width: min(720px, 90vw); box-sizing: border-box; padding: 14px 20px 10px; z-index: 6; cursor: pointer; border-radius: 10px;
        background: linear-gradient(180deg, var(--md-window-top), var(--md-window-bottom)); border: 3px solid var(--md-border); box-shadow: 0 0 0 3px var(--md-ink), inset 0 0 0 2px var(--md-border-shade), 0 8px 0 rgba(0, 0, 0, 0.4); animation: story-box-in 0.25s ease-out both; }
      .story-box-text { margin: 0; font-family: var(--md-text-font); font-size: 19px; line-height: 1.45; color: var(--md-text); }
      .story-box-next { margin: 6px 0 0; text-align: right; font-family: var(--md-text-font); font-size: 13px; color: var(--md-text-dim); animation: tutorial-sign-blink 1.4s ease-in-out infinite; }
      .story-box-next kbd { display: inline-block; margin: 0 2px; padding: 0 6px; border-radius: 4px; font-family: var(--md-font); font-size: 12px; color: var(--md-text); background: rgba(5, 6, 13, 0.45); border: 1px solid var(--md-border-shade); }
      @keyframes story-box-in { from { opacity: 0; transform: translate(-50%, 8px); } to { opacity: 1; transform: translate(-50%, 0); } }
      @media (prefers-reduced-motion: reduce) { .story-box, .story-box-next { animation: none; } }
      /* Settings in tabs (src/app/main.ts settingsScreen; odd/tasks/menu-redesign.md S6): the tab bar over the list, the cursor's sentence under it. */
      .settings-tabs { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 10px; }
      .settings-tabs button { font: inherit; font-size: 18px; color: var(--md-text-dim); background: rgba(5, 6, 13, 0.35); border: 2px solid var(--md-border-shade); border-radius: 8px; padding: 2px 10px; cursor: pointer; }
      .settings-tabs button.selected { color: var(--md-ink); background: var(--md-cursor); border-color: var(--md-cursor); }
      .settings-about { min-height: 2.8em; margin-top: 10px; color: var(--md-text); }
      html.touch .settings-tabs-hint { display: none; }
      /* The quick wheel on Tab (src/town/quick-wheel-view.ts): a dark ring of seals, the pointed one in gold, its name in the centre. */
      .quick-wheel { display: grid; place-items: center; }
      .quick-wheel-ring { position: relative; width: min(70vh, 80vw, 460px); aspect-ratio: 1; border-radius: 50%; background: radial-gradient(circle, rgba(23, 19, 13, 0.96) 0 34%, rgba(23, 19, 13, 0.9) 35% 58%, rgba(5, 6, 13, 0.55) 59%); border: 2px solid #c9b98f; box-shadow: 0 0 0 3px var(--md-ink), 0 0 40px rgba(0, 0, 0, 0.8); }
      .quick-wheel-centre { position: absolute; inset: 32%; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; gap: 4px; }
      .quick-wheel-name { color: var(--md-cursor); font-weight: 400; }
      .quick-wheel-about { font-family: var(--md-text-font); font-size: 14px; line-height: 1.3; color: var(--md-text-dim); }
      .quick-wheel-seal { position: absolute; transform: translate(-50%, -50%); padding: 0; border: 0; background: none; cursor: pointer; }
      .quick-wheel-seal svg { width: 56px; height: 56px; padding: 12px; box-sizing: border-box; border-radius: 50%; background: #241d13; border: 2px solid #c9b98f; fill: none; stroke: #e8dcb8; stroke-width: 1.3; stroke-linecap: round; stroke-linejoin: round; transition: transform 80ms ease-out; }
      .quick-wheel-seal.selected svg { border-color: var(--md-cursor); stroke: var(--md-cursor); transform: scale(1.15); box-shadow: 0 0 16px rgba(255, 191, 94, 0.5); }
      .md-window .dim { color: var(--md-text-dim); }
      .md-stat { display: flex; justify-content: space-between; gap: 2em; padding: 2px 0; }
      .md-stat-value { color: var(--md-cursor); }
      .md-list { display: flex; flex-direction: column; gap: 2px; outline: none; scrollbar-color: var(--md-border-shade) transparent; }
      /* A list that scrolls inside its window never squeezes a row: two-line rows keep their height instead of overlapping. */
      .md-list > .md-item, .md-list > .md-list-header { flex-shrink: 0; }
      .md-list.horizontal { flex-direction: row; flex-wrap: wrap; justify-content: center; gap: 18px; }
      .md-item { all: unset; box-sizing: border-box; display: flex; align-items: center; gap: 10px; min-height: 1.6em; padding: 3px 12px 3px 6px; border-radius: 6px; cursor: pointer; color: var(--md-text); }
      .md-item:focus-visible { outline: 3px solid var(--md-cursor); }
      .md-item.is-active { background: linear-gradient(90deg, rgba(255, 138, 61, 0.22), rgba(255, 138, 61, 0.04) 70%, transparent); box-shadow: inset 2px 0 0 var(--md-cursor), inset 0 0 0 1px rgba(201, 164, 90, 0.35); color: #fff6e6; }
      .md-item.is-disabled { color: var(--md-disabled); cursor: default; }
      .md-cursor { flex: none; width: 10px; height: 14px; background: var(--md-cursor); clip-path: polygon(0 0, 100% 50%, 0 100%); visibility: hidden; }
      .md-item.is-active .md-cursor { visibility: visible; animation: md-bob var(--md-bob-ms, 600ms) steps(1) infinite; }
      .md-label { flex: 1; }
      .md-value { display: flex; align-items: center; gap: 10px; color: var(--md-cursor); white-space: nowrap; }
      .md-item.is-disabled .md-value { color: var(--md-disabled); }
      .md-arrow { width: 0; height: 0; font-size: 0; border-top: 7px solid transparent; border-bottom: 7px solid transparent; padding: 0 2px; opacity: 0; }
      .md-arrow:first-child { border-right: 9px solid var(--md-text-dim); }
      .md-arrow:last-child { border-left: 9px solid var(--md-text-dim); }
      .md-item.is-active .md-arrow { opacity: 1; }
      .md-arrow:hover { filter: brightness(1.6); }
      .md-list-header { margin: 12px 0 2px; padding-left: 6px; color: var(--md-text-dim); }
      .md-list-header:first-child { margin-top: 0; }
      /* A list and the description of its cursor row (src/ui/describe.ts): the description on the right, in a box as large as its largest
         text (every row's text sits in the same grid cell, all but the live one hidden), so no window resizes and no row moves when the cursor does. */
      .md-menu { display: grid; grid-template-columns: minmax(0, 1fr) var(--md-desc-width, 15em); gap: 0 24px; align-items: start; }
      .md-desc { display: grid; min-width: 0; }
      .md-desc > * { grid-area: 1 / 1; min-width: 0; }
      .md-desc-ghost { visibility: hidden; pointer-events: none; }
      /* Too narrow for two columns (a phone held upright): the box goes under the list, still as tall as its largest text. */
      @media (max-width: 640px) { .md-menu { grid-template-columns: minmax(0, 1fr); gap: 12px; } }
      @keyframes md-open { from { opacity: 0; transform: scale(0.94); } to { opacity: 1; transform: none; } }
      @keyframes md-bob { 0% { transform: translateX(0); } 50% { transform: translateX(3px); } }
      @media (prefers-reduced-motion: reduce) { .md-window, .md-item.is-active .md-cursor { animation: none; } }
      /* ---- Screens (src/app) ---- */
      #app { position: relative; min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 22px; padding: 40px 16px 88px; box-sizing: border-box; }
      canvas.backdrop { position: fixed; left: 0; top: 0; z-index: -1; image-rendering: pixelated; image-rendering: crisp-edges; pointer-events: none; }
      /* The play view is full-bleed (.agents/DESIGN.md §3, 2026-11-04): src/adapters/fit.ts sizes the canvas in CSS px to the window (or a
         world pixel more); the page clips that overshoot. Whole-pixel scaling, never stretched: nearest-neighbour. */
      canvas.game { flex: none; max-width: none; max-height: none; image-rendering: pixelated; image-rendering: crisp-edges; cursor: crosshair; display: block; }
      #app:has(canvas.game) { padding: 0; gap: 0; height: 100vh; height: 100dvh; min-height: 0; overflow: hidden; }
      html:has(canvas.game), body:has(canvas.game) { height: 100%; overflow: hidden; background: var(--md-ink, #050407); }
      /* The legal notice stays on the title, hub, credits and end screens; in play it must not sit over the map (it is in Credits and the title). */
      #app:has(canvas.game) > .notice { display: none; }
      .notice { position: fixed; bottom: 6px; left: 0; right: 0; margin: 0 auto; max-width: 70rem; padding: 0 16px; font-size: 16px; line-height: 1.2; color: var(--md-text-dim); opacity: 0.8; text-align: center; pointer-events: none; text-shadow: 0 2px 0 var(--md-ink); }
      .notice p { margin: 2px 0; }
      .notice.in-game { font-size: 11px; opacity: 0.5; }
      .hint { margin: 0; color: var(--md-text-dim); font-size: 16px; text-shadow: 0 2px 0 var(--md-ink); }
      .news-section { margin: 12px 0 4px; color: var(--md-text-dim); font-size: 16px; }
      .news-list { margin: 0 0 8px; padding-left: 20px; }
      .news-list li { margin: 2px 0; }
      .build-label { margin: 0; color: var(--md-text-dim); font-size: 12px; opacity: 0.7; text-shadow: 0 2px 0 var(--md-ink); }
      .screen-title { margin: 0; font-size: var(--md-heading); color: var(--md-text); text-shadow: 0 3px 0 var(--md-eclipse), 0 6px 0 var(--md-ink); letter-spacing: 0.04em; }
      .screen-row { display: flex; flex-wrap: wrap; gap: 28px; align-items: flex-start; justify-content: center; max-width: 100%; }
      .md-window.narrow { min-width: 20rem; max-width: 30rem; }
      .md-window.wait p { margin: 0; text-align: center; }
      .net-toast { position: fixed; top: 12px; left: 16px; right: 16px; margin: 0 auto; max-width: 40rem; padding: 8px 12px; z-index: 20; text-align: center; color: var(--md-text); background: rgba(15, 26, 69, 0.94); border: 2px solid var(--md-ink); border-radius: 6px; pointer-events: none; }
      a { color: var(--md-xp); }

      .title-logo { text-align: center; margin-top: 18vh; }
      .title-logo h1 { margin: 0; font-size: min(var(--md-title), 13vw); line-height: 1; color: #fff4f0; letter-spacing: 0.03em;
        text-shadow: 0 4px 0 var(--md-eclipse), 0 8px 0 #3a0610, 0 0 30px rgba(232, 40, 58, 0.55); }
      .title-logo .title-alt { margin: 12px 0 0; color: var(--md-text-dim); letter-spacing: 0.3em; text-transform: uppercase; text-shadow: 0 2px 0 var(--md-ink); }
      .title-menu { min-width: 17rem; }

      .species { width: 19rem; }
      .species p { font-size: 16px; }
      .species .ability { margin-top: 8px; color: var(--md-text-dim); }

      .victory-band { position: absolute; left: 0; right: 0; top: 50%; transform: translateY(-50%); z-index: 7; pointer-events: none; padding: 22px 16px 18px; text-align: center;
        background: linear-gradient(180deg, transparent, rgba(5, 6, 13, 0.88) 18%, rgba(5, 6, 13, 0.92) 82%, transparent); animation: victory-band 2.4s ease-out both; }
      .victory-band::before, .victory-band::after { content: ''; position: absolute; left: 10%; right: 10%; height: 2px; background: linear-gradient(90deg, transparent, var(--md-eclipse-glow), var(--md-cursor), var(--md-eclipse-glow), transparent); }
      .victory-band::before { top: 12%; }
      .victory-band::after { bottom: 12%; }
      .victory-band-title { margin: 0; font-family: var(--md-font); font-size: clamp(40px, 9vw, 88px); line-height: 1; letter-spacing: 0.18em; color: var(--md-cursor);
        text-shadow: 0 0 18px rgba(255, 191, 94, 0.65), 0 0 42px rgba(255, 106, 61, 0.45), 0 4px 0 var(--md-ink); animation: victory-flare 2.4s ease-out both; }
      .victory-band-text { margin: 10px 0 0; font-family: var(--md-text-font); font-size: clamp(16px, 2.4vw, 22px); color: var(--md-text); text-shadow: 0 2px 0 var(--md-ink); }

      @media (prefers-reduced-motion: reduce) { .victory-band, .victory-band-title { animation: none; } }

      .result.victory h1 { color: var(--md-cursor); font-size: calc(var(--md-heading) * 1.4); letter-spacing: 0.08em; text-shadow: 0 0 16px rgba(255, 191, 94, 0.6), 0 3px 0 var(--md-ink); }
      .result.defeat h1 { color: var(--md-eclipse); }

      /* End screen: the fan notice flows under the window instead of floating over its buttons (the page scrolls if it must). */
      /* Every menu screen does the same (odd/tasks/menu-redesign.md T2: it sat over the title hints and the loadout at 844x390):
         the notice is the last row of the column, the screen stays centred above it. Runs keep the small fixed .in-game one. */
      #app:not(:has(canvas.game)) { padding-bottom: 12px; }

      #app:not(:has(canvas.game)) > :is(canvas.backdrop) + *, #app:not(:has(canvas.game)) > :first-child:not(canvas.backdrop) { margin-top: auto; }
      #app > .notice:not(.in-game) { position: static; width: 100%; box-sizing: border-box; margin-top: auto; }
